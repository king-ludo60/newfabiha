<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  html, body {
    height: 100%;
    overflow: hidden; 
    touch-action: none; 
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    perspective: 1000px;
    background-color: #10001a; 
  }

  /* 🎯 ব্যাকগ্রাউন্ড ছবি */
  body::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url('https://i.postimg.cc/yYTQngnG/images-(3).jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
  }

  /* ছবির ওপর ওভারলে */
  body::after {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(10, 0, 20, 0.75);
    z-index: -1;
  }

  /* 🎯 ব্যাকগ্রাউন্ডে ঘোরানো ৩ডি ডাইস */
  .bg-dice-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .bg-dice {
    position: absolute;
    width: 80px;
    height: 80px;
    transform-style: preserve-3d;
    opacity: 0.25;
  }

  .bg-dice.d1 { top: 15%; left: 8%; animation: spinDice 12s linear infinite; }
  .bg-dice.d2 { bottom: 20%; right: 8%; width: 110px; height: 110px; animation: spinDiceReverse 15s linear infinite; }
  .bg-dice.d3 { top: 50%; right: 15%; width: 60px; height: 60px; animation: spinDice 10s linear infinite; }

  @keyframes spinDice {
    0% { transform: rotateX(0) rotateY(0); }
    100% { transform: rotateX(360deg) rotateY(360deg); }
  }
  @keyframes spinDiceReverse {
    0% { transform: rotateX(360deg) rotateY(360deg); }
    100% { transform: rotateX(0) rotateY(0); }
  }

  /* 🎯 সাদা ডাইস এবং লাল ডট */
  .bg-face {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #ffffff, #d0d0d0);
    border-radius: 15%;
    border: 1px solid #ffea00;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.2), 0 0 20px rgba(255,255,255,0.2);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 15%;
  }

  .dot {
    background: radial-gradient(circle at 30% 30%, #ff4d4d, #cc0000);
    border-radius: 50%;
    box-shadow: inset -2px -2px 4px rgba(0,0,0,0.5), inset 2px 2px 4px rgba(255,255,255,0.6);
    width: 100%;
    height: 100%;
  }

  /* গ্লো ইফেক্ট */
  .glow {
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(255, 0, 150, 0.2), transparent 70%);
    border-radius: 50%;
    filter: blur(60px);
    animation: pulse 4s infinite alternate;
    z-index: 0;
  }

  @keyframes pulse {
    from { transform: scale(1); opacity: 0.6; }
    to { transform: scale(1.3); opacity: 1; }
  }

  /* 🎯 মূল কন্টেইনার */
  .container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 440px;
    padding: 15px;
    margin-top: -30px;
  }

  /* 🎯 উপরের টাইটেল এবং সাবটাইটেল */
  .title-section {
    text-align: center;
    margin-bottom: 25px;
  }

  .title-section h1 {
    font-size: 42px;
    font-weight: 900;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 5px;
    background: linear-gradient(90deg, #ff007f, #9d00ff, #00d2ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientMove 3s linear infinite;
    filter: drop-shadow(0 0 15px rgba(157, 0, 255, 0.8));
  }

  @keyframes gradientMove {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  .title-section p {
    color: #e0e0e0;
    font-size: 15px;
    letter-spacing: 0.5px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.8);
  }

  .title-section p .mic-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff007f, #b000ff);
    box-shadow: 0 0 10px rgba(255, 0, 127, 0.8);
    font-size: 13px;
  }

  /* 🎯 মেইন গ্লাস বক্স */
  .glass-box {
    background: rgba(20, 10, 35, 0.7); 
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 35px 25px;
    border-radius: 25px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: relative;
  }

  /* হলুদ বর্ডারের গ্লো */
  .glass-box::before {
    content: '';
    position: absolute;
    top: -1px; left: -1px; right: -1px; bottom: -1px;
    border-radius: 25px;
    background: linear-gradient(45deg, #ffbe0b, transparent, #ffbe0b);
    z-index: -1;
    opacity: 0.4;
  }

  /* 🎯 উপরের ৩টি ছোট বাটন */
  .top-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  .small-btn {
    background: linear-gradient(180deg, #2a4b8d 0%, #152c5b 100%);

    border-radius: 14px;
    padding: 15px 5px;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.2);
    text-align: center;
    line-height: 1.2;
  }

  .small-btn i {

  /* 🎯 Facebook লগইন বাটন */
  .fb-btn {

    border: 1.5px solid #82baff;
    border-radius: 16px;
    padding: 18px;

    font-size: 20px;
    font-weight: 800;
    display: flex;
    align-items: center;

    text-decoration: none;

    transition: transform 0.2s;
    margin-top: 5px;
  }

  .fb-btn:active {

  .fb-btn svg {

  /* 🎯 নিচের টেক্সট */
  .footer-text {

  @media (max-width: 380px) {

    .small-btn { font-size: 11px; padding: 12px 2px; }
    .fb-btn { font-size: 17px; padding: 15px; }
    .glass-box { padding: 25px 15px; }
  }
</style>
